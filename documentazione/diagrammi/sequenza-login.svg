  <rect width="1380" height="658" fill="#ffffff"/>
  <text x="690.0" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1e3a5f">Sequenza: accesso</text>
  <rect x="78.0" y="78" width="168.0" height="42" rx="4" fill="#1e3a5f"/><text x="162.0" y="104" text-anchor="middle" font-size="13" fill="#fff">Utente</text><line x1="162.0" y1="120" x2="162.0" y2="618" stroke="#c5d0dc" stroke-dasharray="4 4"/><rect x="342.0" y="78" width="168.0" height="42" rx="4" fill="#1e3a5f"/><text x="426.0" y="104" text-anchor="middle" font-size="13" fill="#fff">Login.jsx</text><line x1="426.0" y1="120" x2="426.0" y2="618" stroke="#c5d0dc" stroke-dasharray="4 4"/><rect x="606.0" y="78" width="168.0" height="42" rx="4" fill="#1e3a5f"/><text x="690.0" y="104" text-anchor="middle" font-size="13" fill="#fff">api.js</text><line x1="690.0" y1="120" x2="690.0" y2="618" stroke="#c5d0dc" stroke-dasharray="4 4"/><rect x="870.0" y="78" width="168.0" height="42" rx="4" fill="#1e3a5f"/><text x="954.0" y="104" text-anchor="middle" font-size="13" fill="#fff">authController</text><line x1="954.0" y1="120" x2="954.0" y2="618" stroke="#c5d0dc" stroke-dasharray="4 4"/><rect x="1134.0" y="78" width="168.0" height="42" rx="4" fill="#1e3a5f"/><text x="1218.0" y="104" text-anchor="middle" font-size="13" fill="#fff">MongoDB</text><line x1="1218.0" y1="120" x2="1218.0" y2="618" stroke="#c5d0dc" stroke-dasharray="4 4"/>
  <line x1="162.0" y1="156" x2="420.0" y2="156" stroke="#1e3a5f" stroke-width="1.3" marker-end="url(#arr)"/><text x="294.0" y="148" text-anchor="middle" font-size="13" fill="#142033">1. Compila email e password, preme Accedi</text><line x1="426.0" y1="208" x2="684.0" y2="208" stroke="#1e3a5f" stroke-width="1.3" marker-end="url(#arr)"/><text x="558.0" y="200" text-anchor="middle" font-size="13" fill="#142033">2. post('/auth/login', { email, password })</text><line x1="690.0" y1="260" x2="948.0" y2="260" stroke="#1e3a5f" stroke-width="1.3" marker-end="url(#arr)"/><text x="822.0" y="252" text-anchor="middle" font-size="13" fill="#142033">3. POST /api/auth/login</text><line x1="954.0" y1="312" x2="1212.0" y2="312" stroke="#1e3a5f" stroke-width="1.3" marker-end="url(#arr)"/><text x="1086.0" y="304" text-anchor="middle" font-size="13" fill="#142033">4. findOne({ email })</text><line x1="1218.0" y1="364" x2="960.0" y2="364" stroke="#5c6b7a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrBack)"/><text x="1086.0" y="356" text-anchor="middle" font-size="13" fill="#142033">5. utente, oppure nessun risultato</text><path d="M954.0,416 h46 v22 h-46" fill="none" stroke="#1e3a5f" stroke-width="1.3" marker-end="url(#arr)"/><text x="1006.0" y="430" font-size="13" fill="#142033">6. confrontaPassword; se valida, firma il JWT (24h)</text><line x1="954.0" y1="468" x2="696.0" y2="468" stroke="#5c6b7a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrBack)"/><text x="822.0" y="460" text-anchor="middle" font-size="13" fill="#142033">7. 200 { token, utente }</text><line x1="690.0" y1="520" x2="432.0" y2="520" stroke="#5c6b7a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrBack)"/><text x="558.0" y="512" text-anchor="middle" font-size="13" fill="#142033">8. response.data</text><path d="M426.0,572 h46 v22 h-46" fill="none" stroke="#1e3a5f" stroke-width="1.3" marker-end="url(#arr)"/><text x="478.0" y="586" font-size="13" fill="#142033">9. salva token e ruolo, poi cambia pagina</text>
</svg>