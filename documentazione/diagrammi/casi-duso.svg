<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1340" viewBox="0 0 1400 1340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="inc" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a5a00"/>
    </marker>
  </defs>
  <rect width="1400" height="1340" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#1e3a5f">Diagramma dei casi d'uso</text>
  <rect x="210" y="72" width="980" height="1148" rx="10" fill="#f4f7fb" stroke="#1e3a5f" stroke-width="2"/>
  <text x="700" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a5f">Calici e Colline</text>

  <!-- Visitatore: consultare, registrarsi, accedere -->
  <polyline points="155,284 280,284 280,162 528,162" fill="none" stroke="#1d4e89" stroke-width="1.6"/>
  <polyline points="155,284 280,284 280,290 528,290" fill="none" stroke="#1d4e89" stroke-width="1.6"/>
  <polyline points="155,284 280,284 280,402 528,402" fill="none" stroke="#1d4e89" stroke-width="1.6"/>

  <!-- Utente: consultare, accedere, acquistare, consultare gli acquisti, disconnettersi. Non si registra. -->
  <polyline points="155,634 400,634 400,178 528,178" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <polyline points="155,634 400,634 400,418 528,418" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <polyline points="155,634 400,634 400,530 528,530" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <polyline points="155,634 400,634 400,660 528,660" fill="none" stroke="#0f6e56" stroke-width="1.6"/>
  <polyline points="155,634 400,634 400,1150 528,1150" fill="none" stroke="#0f6e56" stroke-width="1.6"/>

  <!-- Operatore: consultare, accedere, verificare un biglietto, disconnettersi -->
  <polyline points="1245,554 1000,554 1000,162 872,162" fill="none" stroke="#8a4b08" stroke-width="1.6"/>
  <polyline points="1245,554 1000,554 1000,402 872,402" fill="none" stroke="#8a4b08" stroke-width="1.6"/>
  <polyline points="1245,554 1000,554 1000,790 872,790" fill="none" stroke="#8a4b08" stroke-width="1.6"/>
  <polyline points="1245,554 1000,554 1000,1138 872,1138" fill="none" stroke="#8a4b08" stroke-width="1.6"/>

  <!-- Amministratore: consultare, accedere, dashboard, aggiornare l'evento, disconnettersi.
       Non verifica biglietti e non crea operatori. -->
  <polyline points="1245,994 1100,994 1100,178 872,178" fill="none" stroke="#6b2d5b" stroke-width="1.6"/>
  <polyline points="1245,994 1100,994 1100,418 872,418" fill="none" stroke="#6b2d5b" stroke-width="1.6"/>
  <polyline points="1245,994 1100,994 1100,910 872,910" fill="none" stroke="#6b2d5b" stroke-width="1.6"/>
  <polyline points="1245,994 1100,994 1100,1030 872,1030" fill="none" stroke="#6b2d5b" stroke-width="1.6"/>
  <polyline points="1245,994 1100,994 1100,1162 872,1162" fill="none" stroke="#6b2d5b" stroke-width="1.6"/>

  <line x1="700" y1="326" x2="700" y2="374" stroke="#8a5a00" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#inc)"/>
  <text x="712" y="354" font-size="13" fill="#8a5a00" font-style="italic">«include»</text>

  <ellipse cx="700" cy="170" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="175" text-anchor="middle" font-size="15" fill="#142033">Consultare l'evento</text>

  <ellipse cx="700" cy="290" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="295" text-anchor="middle" font-size="15" fill="#142033">Registrarsi</text>

  <ellipse cx="700" cy="410" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="415" text-anchor="middle" font-size="15" fill="#142033">Accedere</text>

  <ellipse cx="700" cy="530" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="535" text-anchor="middle" font-size="15" fill="#142033">Acquistare biglietti</text>

  <ellipse cx="700" cy="660" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="654" text-anchor="middle" font-size="15" fill="#142033">Consultare i propri</text>
  <text x="700" y="674" text-anchor="middle" font-size="15" fill="#142033">acquisti</text>

  <ellipse cx="700" cy="790" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="795" text-anchor="middle" font-size="15" fill="#142033">Verificare un biglietto</text>

  <ellipse cx="700" cy="910" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="915" text-anchor="middle" font-size="15" fill="#142033">Consultare la dashboard</text>

  <ellipse cx="700" cy="1030" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="1035" text-anchor="middle" font-size="15" fill="#142033">Aggiornare l'evento</text>

  <ellipse cx="700" cy="1150" rx="172" ry="36" fill="#fff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="700" y="1155" text-anchor="middle" font-size="15" fill="#142033">Disconnettersi</text>

  <g fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round">
    <circle cx="120" cy="250" r="16" fill="#fff"/>
    <line x1="120" y1="266" x2="120" y2="308"/>
    <line x1="98" y1="284" x2="142" y2="284"/>
    <line x1="120" y1="308" x2="102" y2="342"/>
    <line x1="120" y1="308" x2="138" y2="342"/>
  </g>
  <text x="120" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">Visitatore</text>

  <g fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round">
    <circle cx="120" cy="600" r="16" fill="#fff"/>
    <line x1="120" y1="616" x2="120" y2="658"/>
    <line x1="98" y1="634" x2="142" y2="634"/>
    <line x1="120" y1="658" x2="102" y2="692"/>
    <line x1="120" y1="658" x2="138" y2="692"/>
  </g>
  <text x="120" y="718" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">Utente</text>
  <text x="120" y="736" text-anchor="middle" font-size="12" fill="#5c6b7a">cliente registrato</text>

  <g fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round">
    <circle cx="1280" cy="520" r="16" fill="#fff"/>
    <line x1="1280" y1="536" x2="1280" y2="578"/>
    <line x1="1258" y1="554" x2="1302" y2="554"/>
    <line x1="1280" y1="578" x2="1262" y2="612"/>
    <line x1="1280" y1="578" x2="1298" y2="612"/>
  </g>
  <text x="1280" y="638" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">Operatore</text>

  <g fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round">
    <circle cx="1280" cy="960" r="16" fill="#fff"/>
    <line x1="1280" y1="976" x2="1280" y2="1018"/>
    <line x1="1258" y1="994" x2="1302" y2="994"/>
    <line x1="1280" y1="1018" x2="1262" y2="1052"/>
    <line x1="1280" y1="1018" x2="1298" y2="1052"/>
  </g>
  <text x="1280" y="1078" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">Amministratore</text>

  <text x="210" y="1264" font-size="13" font-weight="600" fill="#1e3a5f">Associazioni per attore</text>
  <line x1="210" y1="1284" x2="250" y2="1284" stroke="#1d4e89" stroke-width="2.5"/>
  <text x="260" y="1288" font-size="13" fill="#142033">Visitatore</text>
  <line x1="210" y1="1306" x2="250" y2="1306" stroke="#0f6e56" stroke-width="2.5"/>
  <text x="260" y="1310" font-size="13" fill="#142033">Utente</text>
  <line x1="400" y1="1284" x2="440" y2="1284" stroke="#8a4b08" stroke-width="2.5"/>
  <text x="450" y="1288" font-size="13" fill="#142033">Operatore</text>
  <line x1="400" y1="1306" x2="440" y2="1306" stroke="#6b2d5b" stroke-width="2.5"/>
  <text x="450" y="1310" font-size="13" fill="#142033">Amministratore</text>
  <text x="680" y="1288" font-size="13" fill="#142033">La freccia tratteggiata «include» indica che la registrazione</text>
  <text x="680" y="1308" font-size="13" fill="#142033">esegue sempre anche l'accesso, con le credenziali appena create.</text>
</svg>
